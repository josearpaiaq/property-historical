<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Property Historical — Track Your Property Maintenance</title>
    <meta name="title" content="Property Historical — Track Your Property Maintenance" />
    <meta name="description" content="A personal maintenance ledger for all your properties. Track repairs, improvements, expenses, and never forget when something was fixed." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://property-historical-frontend.vercel.app/" />
    <meta property="og:title" content="Property Historical — Track Your Property Maintenance" />
    <meta property="og:description" content="A personal maintenance ledger for all your properties. Track repairs, improvements, expenses, and never forget when something was fixed." />
    <meta property="og:image" content="https://property-historical-frontend.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://property-historical-frontend.vercel.app/" />
    <meta property="twitter:title" content="Property Historical — Track Your Property Maintenance" />
    <meta property="twitter:description" content="A personal maintenance ledger for all your properties. Track repairs, improvements, expenses, and never forget when something was fixed." />
    <meta property="twitter:image" content="https://property-historical-frontend.vercel.app/og-image.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme-storage');
          var parsed = stored ? JSON.parse(stored) : null;
          var theme = parsed && parsed.state ? parsed.state.theme : 'system';
          var isDark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
