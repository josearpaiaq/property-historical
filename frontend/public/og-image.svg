<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Accent gradient blob -->
  <ellipse cx="900" cy="300" rx="300" ry="250" fill="#3b82f6" opacity="0.08"/>
  
  <!-- House icon -->
  <g transform="translate(80, 200)">
    <path d="M0 80V40L40 15L80 40V80L40 95Z" fill="#3b82f6" opacity="0.9" transform="scale(1.5)"/>
    <path d="M40 15L80 40V80L40 95V15Z" fill="#2563eb" opacity="0.9" transform="scale(1.5)"/>
    <rect x="30" y="50" width="15" height="20" rx="2" fill="#fff" opacity="0.9" transform="scale(1.5)"/>
    <rect x="55" y="50" width="15" height="20" rx="2" fill="#fff" opacity="0.7" transform="scale(1.5)"/>
    <rect x="42" y="80" width="18" height="15" fill="#fff" opacity="0.8" transform="scale(1.5)"/>
  </g>
  
  <!-- Title -->
  <text x="260" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Property Historical</text>
  
  <!-- Subtitle -->
  <text x="260" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">Track every repair, improvement, and expense</text>
  <text x="260" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">across all your properties.</text>
  
  <!-- Feature pills -->
  <rect x="260" y="440" width="140" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="296" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">🔧 Repairs</text>
  
  <rect x="420" y="440" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="452" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">📎 Receipts</text>
  
  <rect x="590" y="440" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="620" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">🔔 Reminders</text>
  
  <rect x="770" y="440" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="802" y="464" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">📊 Timeline</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#1e293b"/>
  <text x="80" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">propertyhistorical.app</text>
</svg>
