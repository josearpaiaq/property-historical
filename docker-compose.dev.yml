# Local development - runs PostgreSQL only
# Backend and frontend run natively with pnpm
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Production uses Neon (serverless PostgreSQL) instead.

services:
  postgres:
    image: postgres:16-alpine
    container_name: property-historical-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-property_historical}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
